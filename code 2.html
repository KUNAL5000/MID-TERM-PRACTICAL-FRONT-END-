<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 40px auto;
      padding: 20px;
    }
    .option {
      display: block;
      margin: 10px 0;
    }
    button {
      margin-top: 16px;
      padding: 8px 16px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div id="quiz-container">
    <p id="progress"></p>
    <h2 id="question-text"></h2>
    <div id="options"></div>
    <button id="next-btn" disabled>Next</button>
  </div>

  <div id="result-container" style="display: none;">
    <h2>Quiz Complete</h2>
    <p id="score-text"></p>
    <p id="percentage-text"></p>
    <p id="message-text"></p>
    <button id="restart-btn">Restart</button>
  </div>

  <script>
    const quizQuestions = [
      {
        question: "Which keyword declares a block-scoped constant in JavaScript?",
        options: ["var", "let", "const", "function"],
        correctIndex: 2
      },
      {
        question: "Which method selects the first element matching a CSS selector?",
        options: ["getElementById", "querySelector", "getElementsByClassName", "querySelectorAll"],
        correctIndex: 1
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const quizContainer = document.querySelector("#quiz-container");
    const resultContainer = document.querySelector("#result-container");
    const progressEl = document.querySelector("#progress");
    const questionTextEl = document.querySelector("#question-text");
    const optionsEl = document.querySelector("#options");
    const nextBtn = document.querySelector("#next-btn");
    const scoreTextEl = document.querySelector("#score-text");
    const percentageTextEl = document.querySelector("#percentage-text");
    const messageTextEl = document.querySelector("#message-text");
    const restartBtn = document.querySelector("#restart-btn");

    function renderQuestion() {
      const current = quizQuestions[currentQuestionIndex];
      progressEl.textContent = `Question ${currentQuestionIndex + 1} of ${quizQuestions.length}`;
      questionTextEl.textContent = current.question;
      optionsEl.innerHTML = "";
      nextBtn.disabled = true;

      if (currentQuestionIndex === quizQuestions.length - 1) {
        nextBtn.textContent = "Finish";
      } else {
        nextBtn.textContent = "Next";
      }

      current.options.forEach((option, index) => {
        const label = document.createElement("label");
        label.className = "option";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "answer";
        radio.value = index;

        radio.addEventListener("change", () => {
          nextBtn.disabled = false;
        });

        label.appendChild(radio);
        label.appendChild(document.createTextNode(" " + option));
        optionsEl.appendChild(label);
      });
    }

    function showResult() {
      quizContainer.style.display = "none";
      resultContainer.style.display = "block";

      const total = quizQuestions.length;
      const percentage = (score / total) * 100;

      scoreTextEl.textContent = `Score: ${score}/${total}`;
      percentageTextEl.textContent = `Percentage: ${percentage}%`;

      if (percentage === 100) {
        messageTextEl.textContent = "Excellent work!";
      } else if (percentage >= 50) {
        messageTextEl.textContent = "Good job!";
      } else {
        messageTextEl.textContent = "Keep practising!";
      }
    }

    nextBtn.addEventListener("click", () => {
      const selected = document.querySelector('input[name="answer"]:checked');
      if (!selected) return;

      const selectedIndex = Number(selected.value);
      if (selectedIndex === quizQuestions[currentQuestionIndex].correctIndex) {
        score++;
      }

      currentQuestionIndex++;

      if (currentQuestionIndex < quizQuestions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    });

    restartBtn.addEventListener("click", () => {
      currentQuestionIndex = 0;
      score = 0;
      resultContainer.style.display = "none";
      quizContainer.style.display = "block";
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
